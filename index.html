<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Alchemy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Mini Alchemy</h1>
  <div class="container">
    <div class="results" id="results">
      <h2>Discovered</h2>
    </div>

    <div class="board" id="board">
      <p>Drop elements here to combine!</p>
    </div>

    <div class="elements">
      <h2>Elements</h2>
      <div class="element" draggable="true" id="water">💧 Water</div>
      <div class="element" draggable="true" id="fire">🔥 Fire</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
